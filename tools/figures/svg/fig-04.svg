<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <marker id="ink1" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.8 1 L8.4 5 L0.8 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="mut1" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.8 1 L8.4 5 L0.8 9" fill="none" stroke="var(--muted-foreground)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g id="ring">
    <circle cx="430" cy="226" r="122" stroke="var(--muted-foreground)" stroke-width="2"/>
    <path d="M481.6 115.4 A122 122 0 0 1 529.9 156" stroke="var(--muted-foreground)" stroke-width="2" marker-end="url(#mut1)"/>
  </g>

  <g id="result">
    <rect x="252" y="199" width="88" height="54" fill="var(--background)"/>
    <rect x="258" y="211" width="74" height="6" rx="3" fill="var(--muted-foreground)" opacity=".5"/>
    <rect x="268" y="223" width="54" height="6" rx="3" fill="var(--muted-foreground)" opacity=".5"/>
    <rect x="263" y="235" width="64" height="6" rx="3" fill="var(--muted-foreground)" opacity=".5"/>
    <text x="244" y="231" fill="var(--muted-foreground)" font-size="13" text-anchor="end">result</text>
  </g>

  <g id="tool">
    <rect x="398" y="316" width="64" height="64" rx="8" stroke="currentColor" stroke-width="2" fill="var(--background)"/>
    <path d="M433 331 L421 350 H429 L427 365 L439 346 H431 Z" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="430" y="400" fill="var(--muted-foreground)" font-size="13" text-anchor="middle">tool</text>
  </g>

  <g id="check">
    <path d="M552 204 L574 226 L552 248 L530 226 Z" stroke="currentColor" stroke-width="2" fill="var(--background)"/>
    <text x="616" y="274" fill="var(--muted-foreground)" font-size="13" text-anchor="middle">tool call?</text>
  </g>

  <g id="model">
    <rect x="345" y="58" width="170" height="92" rx="16" stroke="currentColor" stroke-width="2" fill="var(--background)"/>
    <text x="430" y="110" fill="currentColor" font-size="15" text-anchor="middle">model</text>
  </g>

  <g id="entry">
    <path d="M104 104 H345" stroke="var(--muted-foreground)" stroke-width="1.5" marker-end="url(#mut1)"/>
    <text x="224" y="90" fill="var(--muted-foreground)" font-size="13" text-anchor="middle">message</text>
  </g>

  <g id="exit">
    <path d="M574 226 H772" stroke="currentColor" stroke-width="3" marker-end="url(#ink1)"/>
    <rect x="786" y="211" width="84" height="6" rx="3" fill="currentColor"/>
    <rect x="786" y="223" width="60" height="6" rx="3" fill="currentColor"/>
    <rect x="786" y="235" width="72" height="6" rx="3" fill="currentColor"/>
    <text x="828" y="196" fill="currentColor" font-size="13" text-anchor="middle">reply</text>
  </g>
</svg>
